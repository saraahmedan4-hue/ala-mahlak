<!-- شاشة البداية -->
<section class="home" id="home" aria-labelledby="homeName">
  <div class="home-tools"><button class="icon-btn" data-act="lang" type="button"></button><button class="icon-btn" data-act="theme" type="button"><svg class="ic"><use href="#i-moon"/></svg></button></div>
  <div class="home-inner">
    <div class="lockup lockup-lg">
      <svg class="logo" aria-hidden="true"><use href="#logo"/></svg>
      <span class="lockup-ar" id="homeName">على مهلك</span><span class="lockup-sep" aria-hidden="true"></span><span class="lockup-en" lang="en">ALA<br>MAHLAK</span>
    </div>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="pick">
      <button class="pick-card" data-go-view="user" type="button"><span class="pick-ic"><svg class="ic"><use href="#i-wheel"/></svg></span><span class="pick-t" data-i18n="pickUser"></span><span class="pick-s" data-i18n="pickUserSub"></span><svg class="ic pick-arrow flip"><use href="#i-arrow"/></svg></button>
      <button class="pick-card" data-go-view="gov" type="button"><span class="pick-ic"><svg class="ic"><use href="#i-building"/></svg></span><span class="pick-t" data-i18n="pickGov"></span><span class="pick-s" data-i18n="pickGovSub"></span><svg class="ic pick-arrow flip"><use href="#i-arrow"/></svg></button>
    </div>
  </div>
</section>

<!-- الشريط العلوي للواجهتين -->
<header class="bar" id="bar">
  <button class="lockup lockup-sm" data-go-view="home" type="button" aria-label="على مهلك">
    <svg class="logo" aria-hidden="true"><use href="#logo"/></svg><span class="lockup-ar">على مهلك</span><span class="lockup-sep" aria-hidden="true"></span><span class="lockup-en" lang="en">ALA<br>MAHLAK</span>
  </button>
  <div class="bar-tools">
    <button class="pill-btn" data-act="switch" type="button"><svg class="ic"><use href="#i-swap"/></svg><span id="switchLabel"></span></button>
    <button class="icon-btn" data-act="lang" type="button"></button>
    <button class="icon-btn" data-act="theme" type="button"><svg class="ic"><use href="#i-moon"/></svg></button>
  </div>
</header>

<!-- واجهة المستخدم -->
<main class="user" id="user">
  <div class="map" id="userMap"></div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
  <button class="report-fab" id="reportFab" type="button"><svg class="ic"><use href="#i-flag"/></svg><span data-i18n="report"></span></button>
</main>

<!-- واجهة الهيئة -->
<main class="gov" id="gov">
  <div class="gov-head"><h1 data-i18n="govTitle"></h1></div>
  <section class="kpis" id="kpis"></section>
  <div class="gov-grid">
    <section class="g-card g-map"><div class="map" id="govMap"></div><div class="legend" id="legend"></div></section>
    <section class="g-card g-list"><div class="g-head"><h2 data-i18n="reports"></h2><span class="count" id="repCount"></span></div><ol class="rows" id="rows"></ol></section>
  </div>
</main>

<div class="sheet" id="sheet" hidden><div class="sheet-body" id="sheetBody" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/map-data.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
