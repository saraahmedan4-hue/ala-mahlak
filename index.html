<!doctype html>

    <symbol id="i-metro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="14" rx="3"/><path d="M6 10h12M9 14h.01M15 14h.01M8 21l2-4M16 21l-2-4"/></symbol>

<header class="topbar">
  <a class="brand" href="./" aria-label="على مهلك · Ala Mahlak">
    <svg class="brand-mark" aria-hidden="true"><use href="#logo"/></svg>
    <span class="brand-ar">على مهلك</span>
    <span class="brand-sep" aria-hidden="true"></span>
    <span class="brand-en">ALA<br>MAHLAK</span>
  </a>
  <div class="top-actions">
    <span class="demo-tag" data-i18n="demoData"></span>
    <button class="btn btn-ghost" id="langBtn" type="button" lang="en"></button>
    <button class="btn btn-ghost" id="themeBtn" type="button"><svg class="ic"><use href="#i-moon"/></svg><span id="themeLabel"></span></button>
    <button class="btn btn-primary" id="tryBtn" type="button" aria-controls="phoneWrap" aria-expanded="false"><svg class="ic"><use href="#i-wheel"/></svg><span data-i18n="tryUser"></span></button>
  </div>
</header>

<div class="layout" id="layout">
  <main class="board" id="board" aria-labelledby="boardTitle">
    <div class="board-head">
      <h1 id="boardTitle" data-i18n="boardTitle"></h1>
      <p class="muted" data-i18n="boardSub"></p>
    </div>

    <section class="kpis" aria-live="polite">
      <div class="kpi"><span class="kpi-label" data-i18n="kpiReports"></span><strong class="kpi-num" id="kpiReports"></strong><span class="kpi-note" data-i18n="kpiReportsNote"></span></div>
      <div class="kpi"><span class="kpi-label" data-i18n="kpiAlt"></span><strong class="kpi-num" id="kpiAlt"></strong><span class="kpi-note" data-i18n="kpiAltNote"></span></div>
      <div class="kpi"><span class="kpi-label" data-i18n="kpiWorst"></span><strong class="kpi-num kpi-place" id="kpiWorst"></strong><span class="kpi-note" id="kpiWorstNote"></span></div>
    </section>

    <div class="board-grid">
      <section class="card map-card" aria-labelledby="mapTitle">
        <div class="card-head"><h2 id="mapTitle" data-i18n="mapTitle"></h2><span class="tag-info"><svg class="ic"><use href="#i-branch"/></svg><span data-i18n="proposed"></span></span></div>
        <div class="map" id="map" dir="ltr" role="img" aria-label=""></div>
        <ul class="place-list" id="placeList"></ul>
        <details class="rules"><summary data-i18n="rulesTitle"></summary><p data-i18n="rules"></p></details>
      </section>

      <section class="card reports-card" aria-labelledby="listTitle">
        <div class="card-head"><h2 id="listTitle" data-i18n="listTitle"></h2></div>
        <ol class="reports" id="reports" aria-live="polite"></ol>
      </section>
    </div>

    <section class="agents" aria-labelledby="agentsTitle">
      <h2 id="agentsTitle" data-i18n="agentsTitle"></h2>
      <div class="agents-row" id="agents" aria-live="polite"></div>
      <p class="loop" data-i18n="loop"></p>
    </section>

    <footer class="foot">
      <p><span data-i18n="footData"></span> · <a href="DATA_SOURCES.md" data-i18n="sources"></a></p>
      <p lang="en" dir="ltr">© OpenStreetMap contributors · © OpenFreeMap · © OpenMapTiles</p>
    </footer>
  </main>

  <aside class="phone-wrap" id="phoneWrap" hidden>
    <button class="btn btn-ghost back-btn" id="backBtn" type="button"><svg class="ic flip"><use href="#i-arrow"/></svg><span data-i18n="backToBoard"></span></button>
    <div class="phone" role="region" aria-label="على مهلك">
      <div class="phone-notch" aria-hidden="true"></div>
      <div class="phone-screen" id="screen" aria-live="polite"></div>
      <div class="vib-bar" id="vibBar" hidden>
        <svg class="ic"><use href="#i-vib"/></svg>
        <span class="vib-pulses" id="vibPulses" aria-hidden="true"></span>
        <strong id="vibLabel"></strong>
        <button class="link-btn" id="vibWhat" type="button" data-i18n="vibWhat"></button>
      </div>
      <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-body" id="sheetBody"></div></div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
  </aside>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>

</html>
